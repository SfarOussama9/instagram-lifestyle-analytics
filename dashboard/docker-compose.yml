services:
  backend:
    image: python:3.11-slim
    working_dir: /workspace/dashboard/backend
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ../:/workspace
    ports:
      - "8000:8000"

  frontend:
    image: node:20-alpine
    working_dir: /workspace/dashboard/frontend
    command: >
      sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    volumes:
      - ../:/workspace
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    depends_on:
      - backend